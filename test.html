<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kommunicate Chat Test</title>
</head>
<body>
    <h1>Kommunicate Chat Test Page</h1>
    <p>The chat widget should appear in the bottom right corner.</p>

    <div id="status"></div>
    <script>
        function updateStatus(message) {
            document.getElementById('status').innerHTML += `<p>${new Date().toISOString()}: ${message}</p>`;
            console.log(message);
        }

        (function(d, m){
            var kommunicateSettings = {
                "appId": "204f13aa870671f3816284e7930d62a65",
                "popupWidget": true,
                "automaticChatOpenOnNavigation": true,
                "onInit": function() {
                    updateStatus("Kommunicate widget initialized");
                    // Force open the chat widget after initialization
                    window.kommunicate && window.kommunicate.launchConversation();
                },
                "onMessageReceived": function(message) {
                    updateStatus("Message received: " + JSON.stringify(message));
                },
                "onMessageSent": function(message) {
                    updateStatus("Message sent: " + JSON.stringify(message));
                },
                "onError": function(error) {
                    updateStatus("Error: " + JSON.stringify(error));
                },
                "localeSettings": {
                    "botMessageDelayInterval": 0
                },
                "voiceOutput": false,
                "useOriginalWhatsappMsg": true,
                "botIds": ["bot"],
                "customWelcomeEvent": true,
                "restartConversationByUser": true,
                "displayUserName": true
            };
            var s = document.createElement("script");
            s.type = "text/javascript";
            s.async = true;
            s.src = "https://widget.kommunicate.io/v2/kommunicate.app";
            var h = document.getElementsByTagName("head")[0];
            h.appendChild(s);
            window.kommunicate = m;
            m._globals = kommunicateSettings;
        })(document, window.kommunicate || {});
    </script>
    <style>
        #status {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            max-height: 400px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        #status p {
            margin: 5px 0;
            font-family: monospace;
            font-size: 12px;
            border-bottom: 1px solid #eee;
            padding: 5px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .info {
            margin: 20px;
            padding: 15px;
            background: #e8f4ff;
            border-radius: 5px;
        }
    </style>

    <div class="info">
        <h3>Debug Information:</h3>
        <ul>
            <li>App ID: 204f13aa870671f3816284e7930d62a65</li>
            <li>Webhook URL: https://flowise-kommunicate-proxy-v2.onrender.com/webhook</li>
            <li>Environment: Production</li>
        </ul>
    </div>
</body>
</html>
